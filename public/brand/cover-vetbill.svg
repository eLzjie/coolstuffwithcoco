<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1035" width="800" height="1035" role="img" aria-label="The $1,000 Vet Bill — guide cover">
  <title>The $1,000 Vet Bill — guide cover</title>

  <!--
    Designed stand-in for the real PDF cover art, drawn in the locked palette.
    Sky = /vetbill territory (protective).

    Tone rule: protective, never predatory. So the motif is a shield with a
    care cross inside it — preparedness — rather than a bill, a receipt, a
    warning triangle or anything that reads as a scare tactic. Coral is used
    only on the small tag and the cross, never as a wash.
  -->

  <defs>
    <clipPath id="v-card">
      <rect width="800" height="1035" rx="18" />
    </clipPath>
  </defs>

  <g clip-path="url(#v-card)">
    <rect width="800" height="1035" fill="#A8DEFA" />

    <circle cx="400" cy="312" r="300" fill="#FDF9F5" opacity="0.5" />
    <circle cx="112" cy="900" r="190" fill="#D0F4E0" opacity="0.65" />
    <circle cx="712" cy="948" r="128" fill="#FDF9F5" opacity="0.4" />

    <!-- Shield with a care cross: ready, not frightened -->
    <g transform="translate(400 300)">
      <path d="M0 -186 L156 -128 V26 Q156 138 0 196 Q-156 138 -156 26 V-128 Z"
            fill="#FDF9F5" stroke="#211C1A" stroke-width="12" stroke-linejoin="round" />
      <path d="M-38 -84 h76 v58 h58 v76 h-58 v58 h-76 v-58 h-58 v-76 h58 Z"
            fill="#F4837E" stroke="#211C1A" stroke-width="8" stroke-linejoin="round" />
    </g>

    <!-- Title -->
    <g font-family="Poppins, 'Segoe UI', Verdana, sans-serif" font-weight="700" fill="#211C1A">
      <text x="64" y="648" font-size="60" letter-spacing="-1.5">The</text>
      <text x="64" y="748" font-size="112" letter-spacing="-4">$1,000</text>
      <text x="64" y="838" font-size="72" letter-spacing="-2.5">vet bill</text>
      <text x="64" y="890" font-size="30" font-weight="400" opacity="0.8">Know the signs. Know the number.</text>
    </g>

    <!-- Free tag -->
    <g transform="translate(64 926)">
      <rect width="196" height="58" rx="29" fill="#F4837E" stroke="#211C1A" stroke-width="4" />
      <text x="98" y="38" font-family="Poppins, 'Segoe UI', Verdana, sans-serif" font-weight="700"
            font-size="26" fill="#211C1A" text-anchor="middle">Free guide</text>
    </g>

    <!-- Heart mark, bottom right -->
    <g transform="translate(652 912) scale(1.5)" fill="#211C1A" opacity="0.45">
      <path d="M24 41c-1 0-1.9-.4-2.6-1L8.6 27.2A11.4 11.4 0 0 1 24 10.6a11.4 11.4 0 0 1 15.4 16.6L26.6 40c-.7.6-1.6 1-2.6 1Z" />
    </g>

    <rect x="2" y="2" width="796" height="1031" rx="17" fill="none" stroke="#211C1A" stroke-width="4" />
  </g>
</svg>
